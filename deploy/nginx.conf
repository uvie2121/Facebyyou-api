# Nginx reverse proxy in front of Uvicorn on the EC2 host.
# Place at /etc/nginx/conf.d/facebyyou-api.conf

server {
    listen 80;
    server_name _;

    # Cap request body; large media goes directly to S3 via presigned POST,
    # so the API itself only handles small JSON payloads.
    client_max_body_size 2m;

    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
