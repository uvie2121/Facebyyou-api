name: Deploy

# Deploys to the EC2 instance via AWS SSM Run Command using short-lived OIDC
# credentials -- no SSH keys, no long-lived AWS secrets, no open port 22 needed.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_REGION            e.g. us-east-1
#   AWS_DEPLOY_ROLE_ARN   terraform output github_deploy_role_arn
#   SSM_INSTANCE_ID       terraform output api_instance_id

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # required for OIDC
  contents: read

# Run JavaScript-based actions (e.g. aws-actions/configure-aws-credentials) on
# Node 24 instead of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy ref
        id: vars
        run: echo "ref=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          DEPLOY_REF: ${{ steps.vars.outputs.ref }}
        run: |
          set -euo pipefail

          # Build the remote script, then base64-encode it. We send a single
          # one-line command (echo <b64> | base64 -d | bash) because the AWS CLI
          # shorthand parser does not interpret JSON \n escapes -- a multi-line
          # script passed directly would collapse onto one line.
          # SSM runs as root, but the repo/venv are owned by the 'facebyyou'
          # service user. Run git/pip as that user (avoids git's "dubious
          # ownership" guard and keeps file ownership correct); use root only
          # for the systemctl restart.
          cat > deploy_remote.sh <<EOF
          set -euo pipefail
          cd /opt/facebyyou-api
          sudo -u facebyyou git fetch --all --prune
          sudo -u facebyyou git reset --hard "origin/${DEPLOY_REF}"
          sudo -u facebyyou /opt/facebyyou-api/.venv/bin/pip install --upgrade -r requirements.txt
          systemctl restart facebyyou-api
          sleep 5
          curl -fsS http://127.0.0.1:8000/api/v1/health
          EOF

          B64=$(base64 -w0 deploy_remote.sh)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${DEPLOY_REF} (${GITHUB_SHA::7})" \
            --parameters commands="echo $B64 | base64 -d | bash" \
            --query "Command.CommandId" --output text)
          echo "Sent SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "::group::Deploy output"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::Deploy errors"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
