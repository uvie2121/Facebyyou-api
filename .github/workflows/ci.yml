name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

# Run JavaScript-based actions on Node 24 instead of the deprecated Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install System Graphics Dependencies (for MediaPipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1 libgles2 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t facebyyou-api:ci .
